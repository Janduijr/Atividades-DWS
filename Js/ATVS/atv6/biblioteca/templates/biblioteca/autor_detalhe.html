<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ autor.nome }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'listar_livros' %}">Mini biblioteca</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'sobre' %}">Sobre</a>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">{{ autor.nome }}</h1>
            <a class="btn btn-outline-secondary" href="{% url 'listar_livros' %}">Voltar</a>
        </div>

        <div class="row g-3">
            {% for livro in livros %}
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    {% if livro.capa %}
                        <img src="{{ livro.capa.url }}" alt="{{ livro.titulo }}" class="card-img-top p-2" style="height: 200px; object-fit: contain;">
                    {% endif %}
                    <div class="card-body">
                        <h5 class="card-title">{{ livro.titulo }}</h5>
                    </div>
                    <div class="card-footer">
                        <a class="btn btn-sm btn-warning" href="{% url 'editar_livro' livro.id %}">Editar</a>
                        <a class="btn btn-sm btn-danger" href="{% url 'excluir_livro' livro.id %}">Excluir</a>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12">
                <div class="alert alert-info">Nao ha livros</div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
