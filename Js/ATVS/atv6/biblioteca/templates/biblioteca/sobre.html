<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'listar_livros' %}">Mini biblioteca</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'sobre' %}">Sobre</a>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Sobre</h1>
            <a class="btn btn-outline-secondary" href="{% url 'listar_livros' %}">Voltar</a>
        </div>

        <div class="row g-3">
            <div class="col-6">
                <div class="card text-center">
                    <div class="card-body">
                        <h2 class="display-6 mb-0">{{ total }}</h2>
                        <p class="card-text text-muted">Total de livros</p>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <div class="card text-center">
                    <div class="card-body">
                        <h2 class="display-6 mb-0 text-success">{{ disponiveis }}</h2>
                        <p class="card-text text-muted">Disponíveis</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
