<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar autor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'listar_livros' %}">Mini biblioteca</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'sobre' %}">Sobre</a>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <h1 class="h3 mb-4">Criar autor</h1>

        <div class="card">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <button type="submit" class="btn btn-primary">Criar</button>
                    <a href="{% url 'listar_livros' %}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
