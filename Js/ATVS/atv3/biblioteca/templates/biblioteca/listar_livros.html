<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar livros</title>
</head>
<body>
    <ul>
        {% for livro in livros %}
            <li>{{livro.titulo}}</li>
            <li><a href="{% url 'autor_detalhe' livro.autor.id %}">{{livro.autor.nome}}</a></li>
            <li>{{livro.ano_publicado}}</li>
            <br>
        {% empty %}
            <li>Nao ha livros</li>
        {% endfor %}
    </ul>
</body>
</html>
