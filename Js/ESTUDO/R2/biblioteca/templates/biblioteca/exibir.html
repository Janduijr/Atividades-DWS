<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exibir</title>
</head>
<body>
    {% for livro in livros %}
        <h1>{{livro.titulo}}</h1>
        <h2><a href="{% url 'autor' livro.autor.id %}">{{livro.autor}}</h2></a>
        <br>
    {% empty %}
        <p>Nao possui livros!</p>
    {% endfor %}
    <a href="{% url 'adicionar' %}">Adiconar livro</a>
</body>
</html>
