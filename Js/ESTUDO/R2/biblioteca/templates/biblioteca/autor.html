<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exibir</title>
</head>
<body>
    <h1>{{autor.nome}}</h1>
    {% for livro in livros %}
        <h1>{{livro.titulo}}</h1>

    {% empty %}
        <p>Nao possui livros!</p>
    {% endfor %}
</body>
</html>
