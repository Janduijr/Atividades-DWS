{% extends 'agenda/base.html'%}
{% block title %}detalhes{% endblock title %}

{% block conteudo %}

    <h1>{{local}}</h1>
    <p>{{local.capacidade}}</p>
    {% for evento in local.eventos.all %}
        <a href="{% url 'detalhe' evento.id %}"><p>{{evento}}</p></a>
    {% empty %}
        <p>Nao ha eventos!</p>
    {% endfor %}

{% endblock conteudo %}

{% block script %}
    <script></script>
{% endblock script %}
